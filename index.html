<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planfeto - Sistema de Entregas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <div id="login" class="login">
        <img src="logo.png" alt="Logo" class="logo-login">
        <h1>PLANFETO</h1>
        <input id="user" placeholder="Usuário (admin)">
        <input id="pass" type="password" placeholder="Senha (123)">
        <button onclick="login()">Entrar</button>
    </div>

    <div id="app" class="hidden">
        <aside>
            <img src="logo.png" style="width: 80px; margin: 0 auto 10px; display: block;">
            <h2>Planfeto</h2>
            <button onclick="showPage('dashboard')">Dashboard</button>
            <button onclick="showPage('nova')">Nova Entrega</button>
            <button onclick="showPage('lista')">Entregas</button>
            <button onclick="showPage('mapa-rastreio')">Mapa de Rotas</button>
            <button onclick="logout()">Sair</button>
        </aside>

        <main>
            <section id="dashboard">
                <h2>Painel</h2>
                <div class="cards">
                    <div class="card"><h3 id="total">0</h3><p>Total</p></div>
                    <div class="card"><h3 id="pendentes">0</h3><p>Pendentes</p></div>
                    <div class="card"><h3 id="entregues">0</h3><p>Entregues</p></div>
                </div>
            </section>

            <section id="nova" class="hidden">
                <h2>Nova Entrega</h2>
                <input id="cliente" placeholder="Nome do Cliente">
                <input id="endereco" placeholder="Endereço">
                <input type="file" id="foto" style="display:none"> 
                
                <select id="status">
                    <option value="Pendente">Pendente</option>
                    <option value="Entregue">Entregue</option>
                </select>
                <button onclick="addEntrega()">Cadastrar Entrega</button>
            </section>

            <section id="lista" class="hidden">
                <h2>Entregas</h2>
                <div id="busca-area">
                    <input id="busca" placeholder="Buscar cliente..." onkeyup="buscar()">
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Endereço</th>
                            <th>Status</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela"></tbody>
                </table>
            </section>

            <section id="mapa-rastreio" class="hidden">
                <h2>Mapa de Circulação</h2>
                <div id="map" style="height: 450px; width: 100%; border-radius: 12px;"></div>
            </section>
        </main>
    </div>

    <div id="modalFoto" class="login hidden" style="background: rgba(0,0,0,0.9); z-index: 9999; position: fixed; top:0; left:0; width:100%; height:100%;">
        <div style="background: #1f2937; padding: 30px; border-radius: 15px; text-align: center; width: 90%; max-width: 400px;">
            <h3 style="color: #3b82f6;">Finalizar Entrega</h3>
            <p style="color: #9ca3af; margin: 15px 0;">Tire a foto do comprovante:</p>
            <input type="file" id="fotoEntrega" accept="image/*" capture="environment" style="margin-bottom: 20px; color: white;">
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button onclick="fecharModal()" style="background: #4b5563; padding:10px; border-radius:5px; border:none; color:white; cursor:pointer;">Cancelar</button>
                <button onclick="confirmarEntregaComFoto()" style="background: #22c55e; padding:10px; border-radius:5px; border:none; color:white; cursor:pointer;">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
